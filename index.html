<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistem Tuntutan Mengajar Al-Quran</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f6b4f">
<meta name="apple-mobile-web-app-title" content="Tuntutan Al-Quran">
<style>
  :root { --hijau: #0f6b4f; --hijau-muda: #e7f3ee; --kelabu: #6b7280; --garis: #d1d5db; --merah: #b42318; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f7f8; color: #111827; }
  header { background: var(--hijau); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  header img { height: 44px; width: auto; }
  .muat-semula { flex: none; width: 40px; height: 40px; border: 1px solid rgba(255,255,255,.5); border-radius: 50%; background: none; color: #fff; font-size: 1.4rem; line-height: 1; cursor: pointer; }
  header h1 { font-size: 1.05rem; margin: 0; flex: 1; }
  nav { display: flex; background: #fff; border-bottom: 1px solid var(--garis); position: sticky; top: 0; z-index: 2; }
  nav button { flex: 1; padding: 12px 4px; border: 0; background: none; font: inherit; font-size: .9rem; color: var(--kelabu); border-bottom: 3px solid transparent; cursor: pointer; }
  nav button.aktif { color: var(--hijau); border-color: var(--hijau); font-weight: 600; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  section { display: none; }
  section.aktif { display: block; }
  .kad { background: #fff; border: 1px solid var(--garis); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  label { display: block; font-size: .85rem; font-weight: 600; margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  input, select, textarea { width: 100%; padding: 10px; font: inherit; border: 1px solid var(--garis); border-radius: 8px; background: #fff; }
  /* Input tarikh asal (format ikut bahasa browser) dilitupi paparan hari/bulan/tahun */
  .tarikh-kotak { position: relative; }
  #tarikhPapar { padding: 10px; border: 1px solid var(--garis); border-radius: 8px; background: #fff; }
  #tarikh { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .dua { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pantas { display: flex; gap: 8px; margin-top: 8px; }
  .pantas button { flex: 1; }
  .btn { padding: 10px 14px; font: inherit; border-radius: 8px; border: 1px solid var(--hijau); background: #fff; color: var(--hijau); cursor: pointer; text-decoration: none; text-align: center; }
  .kerap { display: grid; gap: 6px; }
  .kerap .btn { text-align: left; }
  button.utama { background: var(--hijau); color: #fff; width: 100%; margin-top: 16px; padding: 12px; font-weight: 600; }
  button.bahaya { border-color: var(--merah); color: var(--merah); }
  button:disabled { opacity: .5; }
  .ringkas { background: var(--hijau-muda); border-radius: 8px; padding: 10px; margin-top: 12px; text-align: center; font-weight: 600; color: var(--hijau); }
  .bulan { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .bulan input { flex: 1; }
  .item { display: flex; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
  .item:last-child { border-bottom: 0; }
  .item div { flex: 1; }
  .item small { color: var(--kelabu); display: block; }
  .item .btn { padding: 6px 10px; font-size: .85rem; }
  .jumlah { font-size: 1.1rem; font-weight: 700; text-align: right; }
  .mesej { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 16px; border-radius: 8px; display: none; z-index: 9; max-width: 90vw; }
  .kosong { color: var(--kelabu); text-align: center; padding: 20px 0; }

  /* Borang: susunan meniru borang kertas, A4 */
  .pratonton { overflow-x: auto; background: #e5e7eb; padding: 12px; border-radius: 10px; }
  .halaman { width: 210mm; min-height: 297mm; background: #fff; color: #000; padding: 9mm 14mm; margin: 0 auto 12px; font-family: Arial, Helvetica, sans-serif; font-size: 10.5pt; }
  .kepala { display: flex; align-items: center; gap: 14px; }
  .kepala img { width: 18mm; }
  .kepala .ar { font-size: 11pt; }
  .kepala b { display: block; }
  .tajuk { text-align: center; font-size: 15pt; font-weight: 700; margin: 4mm 0; }
  .medan { display: flex; gap: 6mm; margin: 2.5mm 0; }
  .medan span { flex: 1; border-bottom: 1px dotted #000; padding-left: 2mm; }
  .halaman table { width: 100%; border-collapse: collapse; margin-top: 3mm; }
  .halaman th, .halaman td { border: 1px solid #000; padding: 0 2mm; height: 5.8mm; text-align: center; }
  .halaman td.catatan { text-align: left; }
  .halaman p { margin: 3mm 0; }
  .kotak { border: 1px solid #000; width: 125mm; padding: 2.5mm 4mm; margin-top: 1mm; line-height: 1.6; }
  .tt { margin-top: 6mm; display: flex; justify-content: space-between; align-items: flex-end; }
  .tt .ruang { height: 12mm; }

  @media print {
    @page { size: A4; margin: 0; }
    body { background: #fff; }
    header, nav, .tiada-cetak, .mesej { display: none !important; }
    main { max-width: none; padding: 0; }
    section:not(.aktif) { display: none !important; }
    .pratonton { background: none; padding: 0; overflow: visible; }
    .halaman { margin: 0; page-break-after: always; }
    .halaman:last-child { page-break-after: auto; }
  }
</style>
</head>
<body>
<header>
  <img src="logo-warna.png" alt="">
  <h1>SISTEM TUNTUTAN MENGAJAR <span style="white-space:nowrap">AL-QURAN</span></h1>
  <button class="muat-semula" onclick="location.reload()" aria-label="Muat semula" title="Muat semula">↻</button>
</header>
<nav>
  <button data-tab="catat" class="aktif">Catat</button>
  <button data-tab="senarai">Senarai</button>
  <button data-tab="borang">Borang</button>
  <button data-tab="tetapan">Tetapan</button>
  <button data-tab="admin" id="navAdmin" hidden>Admin</button>
</nav>
<main>
  <section id="tab-catat" class="aktif">
    <form id="fCatat" class="kad">
      <label for="tarikh">Tarikh</label>
      <div class="tarikh-kotak">
        <div id="tarikhPapar"></div>
        <input type="date" id="tarikh" required aria-label="Tarikh">
      </div>
      <div id="kerapKotak" hidden><label>Kelas biasa anda</label><div class="kerap" id="kerap"></div></div>
      <label for="tingkatan">Tingkatan</label>
      <select id="tingkatan" required></select>
      <div class="dua">
        <div><label for="mula">Masa mula</label><select id="mula"></select></div>
        <div><label for="tamat">Masa tamat</label><select id="tamat"></select></div>
      </div>
      <div class="pantas">
        <button type="button" class="btn" data-minit="120">2 jam</button>
        <button type="button" class="btn" data-minit="60">1 jam</button>
        <button type="button" class="btn" data-minit="30">30 minit</button>
      </div>
      <div class="ringkas" id="ringkasCatat"></div>
      <label for="catatan">Catatan (pilihan)</label>
      <input id="catatan" placeholder="cth: Ganti Ustaz Ali">
      <button type="submit" class="btn utama" id="btnSimpan">Simpan</button>
      <button type="button" class="btn" id="btnBatal" style="display:none;width:100%;margin-top:8px">Batal ubah</button>
    </form>
  </section>

  <section id="tab-senarai">
    <div class="bulan"><input type="month" class="pilihBulan" aria-label="Bulan"></div>
    <div class="kad" id="senarai"></div>
  </section>

  <section id="tab-borang">
    <div class="bulan tiada-cetak">
      <input type="month" class="pilihBulan" aria-label="Bulan">
      <button class="btn" onclick="print()">Cetak / PDF</button>
    </div>
    <div class="kad tiada-cetak" id="kotakSelesai"></div>
    <div class="pratonton" id="borang"></div>
  </section>

  <section id="tab-tetapan">
    <form id="fTetapan" class="kad">
      <label for="tNama">Nama</label><input id="tNama">
      <label for="tKp">No Kad Pengenalan</label><input id="tKp" inputmode="numeric">
      <label for="tTel">No Telefon</label><input id="tTel" inputmode="tel">
      <button type="submit" class="btn utama">Simpan tetapan</button>
    </form>
  </section>

  <section id="tab-admin">
    <div class="bulan tiada-cetak">
      <input type="month" class="pilihBulan" aria-label="Bulan">
      <button class="btn" onclick="cetakGuru(null)">Cetak semua</button>
    </div>
    <div class="pantas tiada-cetak" style="margin:0 0 12px">
      <button class="btn" onclick="cetakRingkasan()">Ringkasan bayaran</button>
      <button class="btn" onclick="muatTurunExcel()">Muat turun Excel</button>
    </div>
    <div class="kad tiada-cetak" id="ringkasAdmin"></div>
    <div class="pratonton" id="borangAdmin"></div>
  </section>
</main>
<div class="mesej" id="mesej"></div>

<script>
const BULAN = ['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
const TINGKATAN = [1,2,3,4,5,6].flatMap(t => [t + 'A', t + 'B']).concat('Syahadah', 'Tahsin', 'Daurah');
const BARIS_SEHALAMAN = 20;
const $ = id => document.getElementById(id);

const API = 'https://script.google.com/macros/s/AKfycbw9zaNiQtD7Z2TaqZCky1uiwonQTdCDmWte-rZWsaIH08MTRll5LtCvUE9QtouTrun0/exec';

let entri = [];        // guru: rekod sendiri; admin: rekod semua guru
let guru = {};         // profil pengguna ini
let semuaGuru = [];    // admin sahaja
let selesai = [];      // {guru, bulan, masa}: bulan yang guru tanda SELESAI
let kadarSejam = 30;
let pilihCetak = null; // admin: id guru untuk dicetak seorang, null = semua
let idUbah = null;
let bulan = new Date().toLocaleDateString('en-CA').slice(0, 7);

const minit = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
const hhmm = min => String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0');
const kiraJam = (mula, tamat) => (minit(tamat) - minit(mula)) / 60;
const rm = n => n.toFixed(2);
const jamTeks = j => String(+j.toFixed(2)); // 0.75, 1.25, 2
function masaTeks(t) {
  const min = minit(t), h = Math.floor(min / 60), h12 = h % 12 || 12;
  const sufiks = h < 12 ? 'pg' : h < 19 ? 'ptg' : 'mlm';
  return h12 + '.' + String(min % 60).padStart(2, '0') + ' ' + sufiks;
}
const tarikhTeks = t => t.split('-').reverse().join('/');
const kadar = () => kadarSejam;
// Pecah kepada halaman 20 baris; sekurang-kurangnya satu halaman kosong
const pecah = (arr, n) => arr.length ? Array.from({ length: Math.ceil(arr.length / n) }, (_, i) => arr.slice(i * n, i * n + n)) : [[]];

console.assert(kiraJam('08:00', '10:00') === 2 && kiraJam('14:00', '14:30') === 0.5, 'kiraJam');
console.assert(masaTeks('08:00') === '8.00 pg' && masaTeks('12:30') === '12.30 ptg' && masaTeks('20:00') === '8.00 mlm', 'masaTeks');
console.assert(kiraJam('08:15', '10:15') === 2 && jamTeks(kiraJam('08:00', '08:45')) === '0.75', 'suku jam');
console.assert(pecah([1,2,3], 2).length === 2 && pecah([], 20).length === 1, 'pecah');
const bertindih = (a, b) => minit(a.mula) < minit(b.tamat) && minit(b.mula) < minit(a.tamat);
console.assert(bertindih({ mula: '08:00', tamat: '10:00' }, { mula: '09:30', tamat: '11:00' }) && !bertindih({ mula: '08:00', tamat: '10:00' }, { mula: '10:00', tamat: '12:00' }), 'bertindih');
function mesej(teks) {
  const m = $('mesej'); m.textContent = teks; m.style.display = 'block';
  clearTimeout(mesej.t); mesej.t = setTimeout(() => m.style.display = 'none', 2500);
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---- API (Google Apps Script) ----
// Link peribadi guru: .../#k=TOKEN. Token dibiarkan dalam URL supaya "Add to Home Screen" di iPhone
// (storan berasingan daripada Safari) masih membawa token.
const kunci = new URLSearchParams(location.hash.slice(1)).get('k');
const token = () => localStorage.getItem('token') || '';
// Elak admin tertukar akaun tanpa sedar bila buka link guru lain
if (kunci && kunci !== token() && (!token() || confirm('Tukar ke akaun lain?'))) localStorage.setItem('token', kunci);

async function api(body) {
  if (!token()) throw new Error('Sila buka link peribadi anda daripada admin');
  const res = body
    ? await fetch(API, { method: 'POST', body: JSON.stringify({ ...body, token: token() }) }) // text/plain: elak preflight CORS
    : await fetch(API + '?token=' + encodeURIComponent(token()));
  const data = await res.json();
  if (!data.ok) throw Object.assign(new Error(data.ralat || 'Ralat pelayan'), { pelayan: true });
  return data;
}
async function muat() {
  try {
    const d = await api();
    guru = d.guru;
    // Rekod yang belum sampai ke Sheet kekal dipaparkan
    entri = d.entri.filter(x => !gilir().some(q => q.id === x.id)).concat(gilir().map(q => ({ ...q, guru: guru.id })));
    kadarSejam = d.kadar;
    semuaGuru = d.semuaGuru || [];
    selesai = d.selesai || [];
    $('navAdmin').hidden = !guru.admin;
    isiTetapan(); lukis(); kemasRingkas();
    hantar();
  } catch (e) { mesej(e.message); }
}

// ---- Gilir simpanan ----
// Apps Script ambil 2-3 saat setiap simpanan. Rekod dipaparkan serta-merta dan dihantar di belakang;
// rekod yang belum sampai disimpan dalam peranti supaya tidak hilang jika app ditutup atau tiada internet.
const gilir = () => JSON.parse(localStorage.getItem('gilir') || '[]');
const setGilir = q => localStorage.setItem('gilir', JSON.stringify(q));
let menghantar = false;
async function hantar() {
  if (menghantar || !token()) return;
  menghantar = true;
  try {
    for (let q = gilir(); q.length; q = gilir()) {
      const r = q[0], sama = x => JSON.stringify(x) === JSON.stringify(r);
      try {
        await api({ action: 'simpan', entri: r });
      } catch (err) {
        if (!err.pelayan) { mesej(`${q.length} rekod belum dihantar. Akan dicuba semula.`); return; }
        // Pelayan tolak (cth data tidak sah): buang dari gilir dan paparan supaya tidak dicuba selamanya
        entri = entri.filter(x => x.id !== r.id); lukis();
        mesej(`Rekod ${tarikhTeks(r.tarikh)} ditolak: ${err.message}`);
      }
      setGilir(gilir().filter(x => !sama(x))); // jika diubah semasa dihantar, versi baru kekal
    }
  } finally { menghantar = false; }
}
addEventListener('online', hantar);
addEventListener('beforeunload', e => { if (gilir().length) e.preventDefault(); });

// ---- Tab ----
function tukarTab(nama) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('aktif', b.dataset.tab === nama));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('aktif', s.id === 'tab-' + nama));
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => tukarTab(b.dataset.tab));

// ---- Catat ----
const PILIHAN_MASA = Array.from({ length: (23 * 60 - 6 * 60) / 15 + 1 }, (_, i) => hhmm(6 * 60 + i * 15));
$('tingkatan').innerHTML = TINGKATAN.map(t => `<option>${t}</option>`).join('');
for (const id of ['mula', 'tamat']) $(id).innerHTML = PILIHAN_MASA.map(t => `<option value="${t}">${masaTeks(t)}</option>`).join('');

const HARI = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
function paparTarikh() {
  const v = $('tarikh').value;
  $('tarikhPapar').textContent = v ? `${tarikhTeks(v)} (${HARI[new Date(v + 'T00:00').getDay()]})` : 'Pilih tarikh';
}
$('tarikh').onchange = paparTarikh;
$('tarikh').onclick = () => { try { $('tarikh').showPicker(); } catch {} };

function setTamat(minitTambah) {
  const t = Math.min(minit($('mula').value) + minitTambah, 23 * 60);
  $('tamat').value = hhmm(t);
  kemasRingkas();
}
function kemasRingkas() {
  const j = kiraJam($('mula').value, $('tamat').value);
  $('ringkasCatat').textContent = j > 0 ? `${jamTeks(j)} jam × RM${kadar()} = RM${rm(j * kadar())}` : 'Masa tamat mesti selepas masa mula';
  $('btnSimpan').disabled = !(j > 0);
}
function resetCatat() {
  idUbah = null;
  $('tarikh').value = new Date().toLocaleDateString('en-CA'); // yyyy-mm-dd ikut zon waktu tempatan
  $('tingkatan').value = localStorage.getItem('tingkatanAkhir') || TINGKATAN[0];
  $('mula').value = localStorage.getItem('mulaAkhir') || '08:00';
  $('catatan').value = '';
  $('btnSimpan').textContent = 'Simpan';
  $('btnBatal').style.display = 'none';
  paparTarikh();
  setTamat(120);
}
document.querySelectorAll('[data-minit]').forEach(b => b.onclick = () => setTamat(Number(b.dataset.minit)));
// Tukar masa mula: kekalkan tempoh kelas sebelum ini
let tempoh = 120;
$('mula').onfocus = () => { tempoh = Math.max(minit($('tamat').value) - minit($('mula').value), 15); };
$('mula').onchange = () => setTamat(tempoh);
$('tamat').onchange = kemasRingkas;
$('btnBatal').onclick = resetCatat;

$('fCatat').onsubmit = async e => {
  e.preventDefault();
  const r = {
    id: idUbah || crypto.randomUUID(),
    tarikh: $('tarikh').value,
    tingkatan: $('tingkatan').value,
    mula: $('mula').value,
    tamat: $('tamat').value,
    catatan: $('catatan').value.trim(),
    guru: guru.id,
  };
  r.jam = kiraJam(r.mula, r.tamat);
  if (statusSelesai(guru.id, r.tarikh.slice(0, 7))) return mesej('Bulan ini sudah SELESAI. Buka semula di tab Borang untuk menambah atau mengubah.');
  const tindih = entri.find(x => x.guru === guru.id && x.id !== r.id && x.tarikh === r.tarikh && bertindih(x, r));
  if (tindih && !confirm(`Masa bertindih dengan rekod ${tindih.tingkatan} ${masaTeks(tindih.mula)} – ${masaTeks(tindih.tamat)} pada tarikh yang sama. Simpan juga?`)) return;
  setGilir(gilir().filter(x => x.id !== r.id).concat(r));
  entri = entri.filter(x => x.id !== r.id).concat(r);
  localStorage.setItem('tingkatanAkhir', r.tingkatan);
  localStorage.setItem('mulaAkhir', r.mula);
  mesej(idUbah ? 'Dikemas kini' : 'Disimpan');
  bulan = r.tarikh.slice(0, 7);
  resetCatat(); lukis();
  $('tarikh').value = r.tarikh; paparTarikh(); // kekalkan tarikh untuk isi beberapa kelas lepas sekali gus
  hantar();
};

// ---- Senarai & Borang ----
const entriBulan = idGuru => entri.filter(x => x.guru === idGuru && x.tarikh.startsWith(bulan)).sort((a, b) => (a.tarikh + a.mula).localeCompare(b.tarikh + b.mula));
const jumlah = senarai => senarai.reduce((s, x) => s + x.jam, 0);
const statusSelesai = (idGuru, b = bulan) => selesai.find(s => s.guru === idGuru && s.bulan === b);
const namaBulan = () => BULAN[bulan.slice(5) - 1] + ' ' + bulan.slice(0, 4);
const teksSelesai = s => `✓ SELESAI · ${tarikhTeks(s.masa.slice(0, 10))}${s.masa.slice(10)}`;

function lukis() {
  document.querySelectorAll('.pilihBulan').forEach(i => i.value = bulan);
  const senarai = entriBulan(guru.id);
  const jumlahJam = jumlah(senarai);
  const s = statusSelesai(guru.id);

  $('senarai').innerHTML = (s ? `<div class="ringkas" style="margin:0 0 4px">${teksSelesai(s)}</div>` : '')
    + (senarai.length
    ? senarai.map(x => `<div class="item"><div><b>${tarikhTeks(x.tarikh)} · ${esc(x.tingkatan)}</b>
        <small>${masaTeks(x.mula)} – ${masaTeks(x.tamat)} · ${jamTeks(x.jam)} jam${x.catatan ? ' · ' + esc(x.catatan) : ''}</small></div>
        ${s ? '' : `<button class="btn" onclick="ubah('${x.id}')">Ubah</button>
        <button class="btn bahaya" onclick="padam('${x.id}')">Padam</button>`}</div>`).join('')
      + `<div class="jumlah">${jamTeks(jumlahJam)} jam × RM${kadar()} = RM${rm(jumlahJam * kadar())}</div>`
    : '<div class="kosong">Tiada rekod untuk bulan ini</div>');

  $('kotakSelesai').innerHTML = s
    ? `<div class="ringkas" style="margin:0">${teksSelesai(s)}</div>
       <button class="btn" style="width:100%;margin-top:8px" onclick="tandaSelesai(true)">Buka semula untuk ubah</button>`
    : `<small>Semak borang di bawah. Bila semua kelas ${namaBulan()} sudah diisi, tekan SELESAI supaya Setiausaha boleh proses tuntutan.</small>
       <button class="btn utama" ${senarai.length ? '' : 'disabled'} onclick="tandaSelesai(false)">SELESAI</button>`;

  $('borang').innerHTML = borangHTML(guru, senarai);
  lukisKerap();
  if (guru.admin) lukisAdmin();
}

// Guru yang ada rekod bulan ini, ikut nama
const senaraiBayaran = () => semuaGuru.map(g => ({ g, senarai: entriBulan(g.id) })).filter(x => x.senarai.length)
  .sort((a, b) => a.g.nama.localeCompare(b.g.nama));

function lukisAdmin() {
  // Semua guru dipaparkan; yang belum selesai di atas
  const semua = semuaGuru.map(g => ({ g, senarai: entriBulan(g.id), s: statusSelesai(g.id) }))
    .sort((a, b) => !!a.s - !!b.s || a.g.nama.localeCompare(b.g.nama));
  const ada = senaraiBayaran();
  const jam = ada.reduce((s, x) => s + jumlah(x.senarai), 0);
  const siap = semua.filter(x => x.s).length;
  $('ringkasAdmin').innerHTML = semua.length
    ? semua.map(({ g, senarai, s }) => `<div class="item"><div><b>${esc(g.nama) || '(tiada nama)'}</b>
        <small>${senarai.length ? `${senarai.length} kelas · ${jamTeks(jumlah(senarai))} jam · RM${rm(jumlah(senarai) * kadar())}` : 'Tiada rekod'}</small>
        ${s ? '<small style="color:var(--hijau);font-weight:600">✓ Selesai</small>' : '<small style="color:var(--merah)">Belum selesai</small>'}</div>        ${senarai.length ? `<button class="btn" onclick="cetakGuru('${g.id}')">Cetak</button>` : ''}</div>`).join('')
      + `<div class="jumlah">${siap}/${semua.length} guru selesai · ${jamTeks(jam)} jam · RM${rm(jam * kadar())}</div>`
    : '<div class="kosong">Tiada guru</div>';
  $('borangAdmin').innerHTML = ada.filter(x => !pilihCetak || x.g.id === pilihCetak).map(x => borangHTML(x.g, x.senarai)).join('');
}
window.cetakGuru = id => { pilihCetak = id; lukisAdmin(); print(); pilihCetak = null; lukisAdmin(); };

// shortcut: satu halaman muat ~35 guru; pecah halaman jika guru bertambah melebihi itu
function ringkasanHTML() {
  const ada = senaraiBayaran(), jam = ada.reduce((s, x) => s + jumlah(x.senarai), 0);
  return `<div class="halaman">${KEPALA}
    <div class="tajuk">RINGKASAN TUNTUTAN MENGAJAR KELAS AL-QURAN</div>
    <div class="medan" style="justify-content:center"><b>BULAN : ${namaBulan().toUpperCase()}</b></div>
    <table><thead><tr><th style="width:7%">BIL</th><th>NAMA</th><th style="width:20%">NO KAD PENGENALAN</th><th style="width:9%">JAM</th><th style="width:14%">JUMLAH (RM)</th><th style="width:12%">STATUS</th></tr></thead>
    <tbody>${ada.map(({ g, senarai }, i) => `<tr><td>${i + 1}</td><td class="catatan">${esc(g.nama)}</td><td>${esc(g.kp)}</td><td>${jamTeks(jumlah(senarai))}</td>
      <td>${rm(jumlah(senarai) * kadar())}</td><td>${statusSelesai(g.id) ? 'Selesai' : 'Belum'}</td></tr>`).join('')}
    <tr><td colspan="3"><b>JUMLAH (${ada.length} GURU)</b></td><td><b>${jamTeks(jam)}</b></td><td><b>${rm(jam * kadar())}</b></td><td></td></tr></tbody></table>
    <div class="tt"><div>Disediakan oleh :<div class="ruang"></div>(......................................................)<br>Setiausaha Al - Quran</div>
      <div>Tarikh : ..............................</div></div>
  </div>`;
}
window.cetakRingkasan = () => { $('borangAdmin').innerHTML = ringkasanHTML(); print(); lukisAdmin(); };

window.muatTurunExcel = () => {
  const teks = v => /^[=+\-@]/.test(v) ? "'" + v : v; // elak Excel baca nama sebagai formula
  const baris = [['Bil', 'Nama', 'No KP', 'No Telefon', 'Jam', 'Jumlah (RM)', 'Status']].concat(senaraiBayaran().map(({ g, senarai }, i) =>
    [i + 1, teks(g.nama), `="${g.kp}"`, `="${g.telefon}"`, jamTeks(jumlah(senarai)), rm(jumlah(senarai) * kadar()), statusSelesai(g.id) ? 'Selesai' : 'Belum selesai']));
  // BOM supaya Excel baca UTF-8; ="..." supaya sifar di depan KP/telefon kekal
  const csv = '﻿' + baris.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `tuntutan-${bulan}.csv`;
  a.click();
};

// Kelas biasa: 3 gabungan tingkatan + masa yang paling kerap diisi guru ini
let kerap = [];
function lukisKerap() {
  const kira = {};
  entri.filter(x => x.guru === guru.id).forEach(x => { const k = [x.tingkatan, x.mula, x.tamat].join('|'); kira[k] = (kira[k] || 0) + 1; });
  kerap = Object.entries(kira).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k]) => k.split('|'));
  $('kerapKotak').hidden = !kerap.length;
  $('kerap').innerHTML = kerap.map(([t, m, s], i) => `<button type="button" class="btn" onclick="pilihKerap(${i})">${esc(t)} · ${masaTeks(m)} – ${masaTeks(s)}</button>`).join('');
}
window.pilihKerap = i => { [$('tingkatan').value, $('mula').value, $('tamat').value] = kerap[i]; kemasRingkas(); };

const KEPALA = `<div class="kepala"><img src="logo.png" alt=""><div>
      <div class="ar">معهد تحفيظ القرءان والقراءات</div>
      <b>MAAHAD TAHFIZ AL QURAN WAL QIRAAT</b><b>16600 PULAI CHONDONG</b></div></div>`;
function borangHTML(profil, senarai) {
  const jumlahJam = jumlah(senarai);
  const [thn, bln] = bulan.split('-');
  const halaman = pecah(senarai, BARIS_SEHALAMAN);
  return halaman.map((h, hi) => `<div class="halaman">${KEPALA}
    <div class="tajuk">BORANG TUNTUTAN MENGAJAR KELAS AL-QURAN</div>
    <div class="medan" style="justify-content:flex-end"><b>BULAN :</b><span style="flex:0 0 35mm">${BULAN[bln - 1].toUpperCase()}</span><b>TAHUN :</b><span style="flex:0 0 25mm">${thn}</span></div>
    <div class="medan"><b>NAMA :</b><span>${esc(profil.nama)}</span></div>
    <div class="medan"><b>NO KAD PENGENALAN :</b><span>${esc(profil.kp)}</span><b>NO TELEFON :</b><span>${esc(profil.telefon)}</span></div>
    <p>Dengan ini, saya menuntut bayaran mengajar kelas Al Quran di Maahad Tahfiz Al Quran Wal Qiraat sebagaimana kenyataan berikut:</p>
    <table><thead><tr><th style="width:9%">BIL</th><th style="width:14%">TARIKH</th><th style="width:13%">TINGKATAN</th><th style="width:26%">MASA</th><th style="width:13%">JUMLAH JAM</th><th>CATATAN</th></tr></thead>
    <tbody>${Array.from({ length: BARIS_SEHALAMAN }, (_, i) => {
      const x = h[i], bil = hi * BARIS_SEHALAMAN + i + 1;
      return x ? `<tr><td>${bil}</td><td>${tarikhTeks(x.tarikh)}</td><td>${esc(x.tingkatan)}</td><td>${masaTeks(x.mula)} – ${masaTeks(x.tamat)}</td><td>${jamTeks(x.jam)}</td><td class="catatan">${esc(x.catatan)}</td></tr>`
               : `<tr><td>${bil}</td><td></td><td></td><td></td><td></td><td></td></tr>`;
    }).join('')}</tbody></table>
    ${hi < halaman.length - 1 ? '<p style="text-align:right"><i>bersambung...</i></p>' : `
    <p style="margin:5mm 0 0"><b>JUMLAH JAM MENGAJAR</b></p>
    <div class="kotak">JUMLAH KESELURUHAN JAM MENGAJAR <b>${jamTeks(jumlahJam)}</b> JAM X RM${kadar()}<br>
      <b style="font-size:12pt">JUMLAH KESELURUHAN, RM : ${rm(jumlahJam * kadar())}</b></div>
    <div class="tt">
      <div>Nama dan tandatangan guru<div class="ruang"></div>( ${esc(profil.nama) || '&nbsp;'.repeat(60)} )</div>
      <div>Disemak oleh :<div class="ruang"></div>(......................................................)<br>Setiausaha Al - Quran<br>Maahad Tahfiz Al Quran Wal Qiraat</div></div>
    <div style="text-align:right;margin-top:5mm">Tarikh : ..............................</div>`}
  </div>`).join('');
}

window.ubah = id => {
  const x = entri.find(e => e.id === id);
  idUbah = id;
  for (const k of ['tarikh', 'tingkatan', 'mula', 'tamat', 'catatan']) $(k).value = x[k];
  $('btnSimpan').textContent = 'Kemas kini';
  $('btnBatal').style.display = 'block';
  paparTarikh(); kemasRingkas(); tukarTab('catat');
};
window.padam = async id => {
  const x = entri.find(e => e.id === id);
  if (!confirm(`Padam rekod ${tarikhTeks(x.tarikh)} ${x.tingkatan}?`)) return;
  try {
    setGilir(gilir().filter(x => x.id !== id));
    await api({ action: 'padam', entri: { id } });
    entri = entri.filter(e => e.id !== id);
    lukis(); mesej('Dipadam');
  } catch (err) { mesej(err.message); }
};
window.tandaSelesai = async batal => {
  if (!confirm(batal ? `Buka semula ${namaBulan()} untuk ubah? Status akan jadi BELUM SELESAI.`
                     : `Tanda ${namaBulan()} sebagai SELESAI? Rekod bulan ini dikunci selepas ini.`)) return;
  mesej('Menghantar...');
  try {
    await hantar();
    if (gilir().some(q => q.tarikh.startsWith(bulan))) throw new Error('Ada rekod bulan ini belum dihantar. Cuba lagi bila ada internet.');
    await api({ action: 'selesai', bulan, batal });
    selesai = selesai.filter(s => !(s.guru === guru.id && s.bulan === bulan));
    if (!batal) selesai.push({ guru: guru.id, bulan, masa: new Date().toLocaleString('sv').slice(0, 16) });
    lukis(); mesej(batal ? 'Dibuka semula' : 'Ditanda SELESAI');
  } catch (err) { mesej(err.message); }
};
document.querySelectorAll('.pilihBulan').forEach(i => i.onchange = () => { if (i.value) { bulan = i.value; lukis(); } });

// ---- Tetapan ----
function isiTetapan() {
  $('tNama').value = guru.nama || '';
  $('tKp').value = guru.kp || '';
  $('tTel').value = guru.telefon || '';
}
$('fTetapan').onsubmit = async e => {
  e.preventDefault();
  const profil = { nama: $('tNama').value.trim(), kp: $('tKp').value.trim(), telefon: $('tTel').value.trim() };
  try {
    await api({ action: 'profil', profil });
    Object.assign(guru, profil);
    semuaGuru.filter(g => g.id === guru.id).forEach(g => Object.assign(g, profil));
    mesej('Tetapan disimpan'); lukis();
  } catch (err) { mesej(err.message); }
};

resetCatat(); lukis(); muat();
</script>
</body>
</html>
